name: CI

on:
  # Branches only: a tag push runs the release workflow, which checks the same
  # commit again before it publishes.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes a running check of the older one.
# Main keeps every run, because the release workflow requires the tagged
# commit's own successful run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The check steps must not leave __pycache__ behind in a tree the release compares.
  PYTHONDONTWRITEBYTECODE: "1"
  # The scripts emit JSON with ensure_ascii=False; force UTF-8 stdout so the
  # Windows runner does not fail on its default ANSI code page.
  PYTHONUTF8: "1"

jobs:
  validate:
    # The generated-artifact checks compare bytes, so they must run on Windows
    # too: .gitattributes keeps the checkout LF and the builders write LF.
    name: validate (${{ matrix.os }})
    # A branch in this repository is checked by its push run. The pull request
    # run checks only a branch from a fork, whose push runs elsewhere.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    # This job runs the aggregate once. The job it replaces ran it three times
    # in sequence, plus 25 of its commands a fourth time, inside the six-hour
    # default. A third of that default leaves the same headroom for one run,
    # and a check that never returns, such as one waiting on a leaked lock,
    # stops here instead.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The checkout holds files the release leaves out, such as these
      # workflows and their links, so the in-process static checks read it
      # here. They and the release identity check need no installed package,
      # so a broken link or a version mismatch fails before the installs.
      - name: Check the checkout and the release identity
        run: python skills/series-continuity-director/scripts/validate_skill.py --only static --only scripts/release_contract.py

      - name: Install declared media test dependencies
        run: python -m pip install -r skills/series-continuity-director/requirements-media.txt

      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --yes --no-progress }
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw 'ffprobe is required for the declared media tests' }

      # Every other step runs Python in UTF-8 mode. This one runs the command
      # line tools with the runner's own code page, which is what a user's
      # console gives them.
      - name: Run the command line tools without UTF-8 mode
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: "0"
        run: python skills/series-continuity-director/scripts/cli_encoding_smoke_test.py

      # build_release.py copies the tracked release members into a stage and
      # runs validate_skill.py there once: the release contract, its
      # regressions, every validator, generator check and smoke test. It then
      # zips the stage and compares the extracted files with it byte for byte.
      - name: Validate the staged tree and build the release archive
        shell: bash
        run: |
          OUT=$(python -c 'import tomllib; print(tomllib.load(open("package-manifest.toml", "rb"))["release"]["output"])')
          python skills/series-continuity-director/scripts/build_release.py --out "$OUT" --reports-dir dist/reports
          # The archive content must be identical on every platform. Print both
          # digests so the matrix jobs can be compared against each other. The
          # raw ZIP digest also depends on the deflate implementation.
          cat "$OUT.sha256"
          python -c 'import json; d = json.load(open("dist/reports/archive-check.json")); print("content_sha256", d["content_sha256"])'

      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.os }}
          path: dist/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload platform archive for reproducibility comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/reports/archive-check.json
          if-no-files-found: error
          retention-days: 2

  package-consistency:
    name: Compare release archives across operating systems
    needs: validate
    runs-on: ubuntu-latest
    # Two downloads and one comparison in a single interpreter.
    timeout-minutes: 10
    steps:
      - name: Download Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-ubuntu-latest
          path: package-linux

      - name: Download Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-windows-latest
          path: package-windows

      - name: Require matching archive content
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def load(root):
              base = Path(root)
              archive = next(base.glob("*.zip"))
              check = json.loads((base / "reports" / "archive-check.json").read_text(encoding="utf-8"))
              return archive.read_bytes(), check["content_sha256"]

          linux_bytes, linux_content = load("package-linux")
          windows_bytes, windows_content = load("package-windows")

          failures = []
          # Member names plus decompressed bytes. This is the portable identity:
          # it survives a differing deflate implementation.
          if linux_content != windows_content:
              failures.append(
                  f"content digests differ: linux={linux_content} windows={windows_content}"
              )
          # Raw bytes additionally cover member metadata such as permission bits
          # and create_system. Both runners pin the same Python, so this must
          # hold too; if only this check fails, suspect the zlib build rather
          # than the archive contents.
          if linux_bytes != windows_bytes:
              failures.append(
                  "raw archive bytes differ: "
                  f"linux={hashlib.sha256(linux_bytes).hexdigest()} "
                  f"windows={hashlib.sha256(windows_bytes).hexdigest()}"
              )
          if failures:
              raise SystemExit("; ".join(failures))
          print("content_sha256", linux_content)
          print("archive_sha256", hashlib.sha256(linux_bytes).hexdigest())
          PY
